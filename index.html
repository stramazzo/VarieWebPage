<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varie pagine web</title>
<style>
:root{--bg:#EDF1F4;--panel:#FFFFFF;--ink:#18222E;--muted:#5B6877;--line:#D3DBE2;--accent:#22735F}
@media (prefers-color-scheme:dark){:root{--bg:#121A22;--panel:#1A242F;--ink:#E6ECF1;--muted:#9AA7B4;--line:#2C3A47;--accent:#4FB89A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:1.6rem;margin:0 0 20px}
ul{list-style:none;margin:0;padding:0}
li a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);text-decoration:none;margin-bottom:12px}
li a:hover,li a:focus-visible{border-color:var(--accent)}
li a strong{display:block;color:var(--accent)}
li a span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Varie pagine web</h1>
  <ul>
    <li><a href="simulatore-fondo-pensione.html"><strong>Simulatore fondo pensione</strong><span>Stima del netto a fine rapporto, deduzione IRPEF, TFR e prelievo prima casa.</span></a></li>
  </ul>
</main>
</body>
</html>
